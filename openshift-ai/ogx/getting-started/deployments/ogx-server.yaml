apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ogxserver
spec:
  distribution:
    image: quay.io/rhoai/odh-ogx-core-rhel9@sha256:0db4d8ab1b4abf29d110efc83d4192d95b162d704d9909fbdfbd990e2017cf1c  #quay.io/rhoai/odh-ogx-core-rhel9:rhoai-3.5-ea.2
  network:
    port: 8321
  workload:
    overrides:
      env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: VLLM_URL
          value: http://llama-32-3b-instruct-predictor.llama.svc.cluster.local:8080/v1
        - name: VLLM_TLS_VERIFY
          value:  "false"
        - name: VLLM_API_TOKEN
          value: "fake"
        - name: VLLM_MAX_TOKENS
          value: "80"
        - name: VLLM_EMBEDDING_URL
          value: http://granite-embeddings-predictor.llama.svc.cluster.local:8080/v1
        - name: ENABLE_PGVECTOR
          value: "pgvector"
        - name: PGVECTOR_PORT
          value: "5432"
        - name: PGVECTOR_DB
          value: "ogx"
        - name: PGVECTOR_USER
          value: "ogx"
        - name: PGVECTOR_PASSWORD
          value: "ogx"
        - name: PGVECTOR_HOST
          value: "pgvector.llama.svc.cluster.local"
        - name: EMBEDDING_MODEL
          value: "granite-embeddings"
        - name: EMBEDDING_PROVIDER_MODEL_ID
          value: "granite-embeddings"
        - name: EMBEDDING_DIMENSION
          value: "768"
        - name: MILVUS_ENDPOINT
          value: "http://milvus-service.llama.svc.cluster.local:19530"
        - name: MILVUS_TOKEN
          value: "MyStr0ngP@ssw0rd"
        - name: MILVUS_CONSISTENCY_LEVEL
          value: "Bounded"
        - name: QDRANT_URL
          value: "http://qdrant-service.llama.svc.cluster.local:6333"
        - name: QDRANT_API_KEY
          value: "abc12345"
        - name: ENABLE_QDRANT
          value: "qdrant-remote"
