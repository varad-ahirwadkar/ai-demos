apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-server-config-inline-emb
  labels:
    ogx.io/watch: "true"
data:
  config.yaml: |
    # OGX Server Configuration
    version: 2
    image_name: rh
    apis:
    - responses
    - batches
    - inference
    - tool_runtime
    - vector_io
    - files
    - file_processors
    providers:
      inference:
      - provider_id: ${env.VLLM_URL:+vllm-inference}
        provider_type: remote::vllm
        config:
          base_url: ${env.VLLM_URL:=}
          max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
          api_token: ${env.VLLM_API_TOKEN:=fake}
          tls_verify: ${env.VLLM_TLS_VERIFY:=true}
          refresh_models: ${env.VLLM_REFRESH_MODELS:=false}
      - provider_id: ${env.VLLM_EMBEDDING_URL:+vllm-embedding}
        provider_type: remote::vllm
        config:
          base_url: ${env.VLLM_EMBEDDING_URL:=}
          max_tokens: ${env.VLLM_EMBEDDING_MAX_TOKENS:=4096}
          api_token: ${env.VLLM_EMBEDDING_API_TOKEN:=fake}
          tls_verify: ${env.VLLM_EMBEDDING_TLS_VERIFY:=true}
          refresh_models: ${env.VLLM_EMBEDDING_REFRESH_MODELS:=false}
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config: {}
      vector_io:
      - provider_id: ${env.ENABLE_FAISS:+faiss}
        provider_type: inline::faiss
        config:
          persistence:
            backend: kv_default
            namespace: vector_io::faiss
      - provider_id: ${env.ENABLE_INLINE_MILVUS:+milvus}
        provider_type: inline::milvus
        notes: Incompatible with multi-worker deployments
        config:
          db_path: /opt/app-root/src/.ogx/distributions/rh/milvus.db
          persistence:
            backend: kv_default
            namespace: vector_io::milvus
      responses:
      - provider_id: meta-reference
        provider_type: inline::builtin
        config:
          persistence:
            agent_state:
              backend: kv_default
              namespace: agents::meta_reference
            responses:
              backend: sql_default
              table_name: agents_responses
              max_write_queue_size: 10000
              num_writers: 4
      tool_runtime:
      - provider_id: file-search
        provider_type: inline::file-search
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
      files:
      # Required at runtime by inline::file-search (see tool_runtime above).
      - provider_id: meta-reference-files
        provider_type: inline::localfs
        config:
          storage_dir: /opt/app-root/src/.ogx/distributions/rh/files
          metadata_store:
            backend: sql_default
            table_name: files_metadata
      file_processors:
      - provider_id: pypdf
        provider_type: inline::pypdf
        config: {}
      batches:
      - provider_id: reference
        provider_type: inline::reference
        config:
          sqlstore:
            table_name: batches
            backend: sql_default
    storage:
      backends:
        kv_default:
          type: kv_postgres
          host: ${env.POSTGRES_HOST:=localhost}
          port: ${env.POSTGRES_PORT:=5432}
          db: ${env.POSTGRES_DB:=ogx}
          user: ${env.POSTGRES_USER:=ogx}
          password: ${env.POSTGRES_PASSWORD:=ogx}
          table_name: ${env.POSTGRES_TABLE_NAME:=ogx_kvstore}
        sql_default:
          type: sql_postgres
          host: ${env.POSTGRES_HOST:=localhost}
          port: ${env.POSTGRES_PORT:=5432}
          db: ${env.POSTGRES_DB:=ogx}
          user: ${env.POSTGRES_USER:=ogx}
          password: ${env.POSTGRES_PASSWORD:=ogx}
      stores:
        metadata:
          backend: kv_default
          namespace: registry
        inference:
          table_name: inference_store
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
        conversations:
          table_name: openai_conversations
          backend: sql_default
        prompts:
          namespace: prompts
          backend: kv_default
        connectors:
          table_name: connectors
          backend: sql_default
    registered_resources:
      models:
      - metadata:
          embedding_dimension: ${env.EMBEDDING_DIMENSION:=768}
        model_id: ${env.EMBEDDING_MODEL:=}
        provider_id: ${env.EMBEDDING_PROVIDER:=vllm-embedding}
        provider_model_id: ${env.EMBEDDING_PROVIDER_MODEL_ID:=ibm-granite/granite-embedding-125m-english}
        model_type: embedding
      vector_dbs: []
      tool_groups:
      - toolgroup_id: builtin::websearch
        provider_id: tavily-search
      - toolgroup_id: builtin::rag
        provider_id: file-search
    vector_stores:
      annotation_prompt_params:
        enable_annotations: true
        annotation_instruction_template: "Cite sources immediately at the end of sentences using <|file-id|> format."
    telemetry:
      enabled: true
    server:
      port: 8321
      auth:
        provider_config:
          type: ${env.AUTH_ISSUER:+oauth2_token}
          audience: ${env.AUTH_AUDIENCE:=ogx}
          issuer: ${env.AUTH_ISSUER:=}
          jwks:
            uri: ${env.AUTH_JWKS_URI:=}
            key_recheck_period: ${env.AUTH_JWKS_RECHECK_PERIOD:=3600}
          verify_tls: ${env.AUTH_VERIFY_TLS:=true}
        access_policy:
        - permit:
            actions: [read]
          when: resource is unowned
          description: "All users can read system resources"
        - permit:
            actions: [create]
          description: "Authenticated users can create resources"
        - permit:
            actions: [read, update, delete]
          when: user is owner
          description: "Owners can manage their own resources"

---
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ogxserver-with-inline-emb
spec:
  distribution:
    image: quay.io/vahirwad/llama-stack-dist:3.5-ea2-ogx
  overrideConfig:
    name: ogx-server-config-inline-emb
    key: config.yaml
  network:
    port: 8321
  workload:
    overrides:
      env:
        - name: POSTGRES_HOST
          value: "postgres.llama.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "llamastack"
        - name: POSTGRES_USER
          value: "llamastack"
        - name: POSTGRES_PASSWORD
          value: "llamastack"
        - name: VLLM_URL
          value: http://llama-32-3b-instruct-predictor.llama.svc.cluster.local:8080/v1
        - name: VLLM_TLS_VERIFY
          value:  "false"
        - name: VLLM_API_TOKEN
          value: "fake"
        - name: VLLM_MAX_TOKENS
          value: "80"
        - name: ENABLE_FAISS
          value: "faiss"
        - name: ENABLE_INLINE_MILVUS
          value: "milvus"
        - name: EMBEDDING_PROVIDER
          value: "sentence-transformers"
