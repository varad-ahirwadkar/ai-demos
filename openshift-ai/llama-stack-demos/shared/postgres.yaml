apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: registry.redhat.io/rhel9/postgresql-16  #postgres:17
      env:
        - name: POSTGRESQL_USER
          value: llamastack
        - name: POSTGRESQL_PASSWORD
          value: llamastack
        - name: POSTGRESQL_DATABASE
          value: llamastack
      ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_HOST: postgres.llama.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: llamastack
  POSTGRES_USER: llamastack
  POSTGRES_PASSWORD: llamastack
---
