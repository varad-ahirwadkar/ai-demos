---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techmart-ui
  labels:
    app: techmart-ui
    component: web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: techmart-ui
  template:
    metadata:
      labels:
        app: techmart-ui
        component: web-ui
    spec:
      containers:
        - name: ui
          image: quay.io/vahirwad/techmart:ui
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: LLAMA_STACK_URL
              value: "http://techmart-llama-stack-service.llama.svc.cluster.local:8321"
            - name: MCP_SERVER_URL
              value: "http://techmart-mcp-server.llama.svc.cluster.local:9001/sse"
            - name: PORT
              value: "8080"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: techmart-ui-secret
                  key: secret-key
                  optional: true
            - name: DB_HOST
              value: "techmart-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: techmart-ui
  labels:
    app: techmart-ui
    component: web-ui
spec:
  selector:
    app: techmart-ui
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: techmart-ui
  labels:
    app: techmart-ui
    component: web-ui
  annotations:
    haproxy.router.openshift.io/timeout: 600s
spec:
  to:
    kind: Service
    name: techmart-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: v1
kind: Secret
metadata:
  name: techmart-ui-secret
type: Opaque
stringData:
  secret-key: "change-this-in-production-to-a-random-secret-key"
