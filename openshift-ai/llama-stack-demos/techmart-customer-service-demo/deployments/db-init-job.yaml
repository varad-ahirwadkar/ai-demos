---
apiVersion: batch/v1
kind: Job
metadata:
  name: techmart-db-init
  labels:
    app: techmart
    component: db-init
spec:
  ttlSecondsAfterFinished: 300  # Clean up after 5 minutes
  template:
    metadata:
      labels:
        app: techmart
        component: db-init
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: quay.io/vahirwad/techmart:db-init
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "🗄️  Creating database schema..."
              psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f /scripts/schema.sql
              
              echo "📊 Loading sample data..."
              python /scripts/init_db.py
              
              echo "✅ Database initialization complete!"
          env:
            - name: DB_HOST
              value: "techmart-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-password
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: techmart-db-secret
                  key: database-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: data
              mountPath: /data
      volumes:
        - name: scripts
          configMap:
            name: techmart-db-scripts
        - name: data
          configMap:
            name: techmart-db-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: techmart-db-scripts
  labels:
    app: techmart
    component: db-init
data:
  schema.sql: |
    -- TechMart Database Schema
    
    -- Drop existing tables if they exist
    DROP TABLE IF EXISTS orders CASCADE;
    
    -- Create orders table
    CREATE TABLE orders (
        id SERIAL PRIMARY KEY,
        order_id VARCHAR(50) UNIQUE NOT NULL,
        customer_email VARCHAR(255) NOT NULL,
        product_name VARCHAR(255) NOT NULL,
        category VARCHAR(100) NOT NULL,
        order_date DATE NOT NULL,
        delivery_date DATE NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        status VARCHAR(50) NOT NULL,
        is_opened VARCHAR(10) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Create indexes for better query performance
    CREATE INDEX idx_orders_order_id ON orders(order_id);
    CREATE INDEX idx_orders_customer_email ON orders(customer_email);
    CREATE INDEX idx_orders_order_date ON orders(order_date);
    CREATE INDEX idx_orders_status ON orders(status);
    
    -- Create trigger to update updated_at timestamp
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ language 'plpgsql';
    
    CREATE TRIGGER update_orders_updated_at BEFORE UPDATE ON orders
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
  
  init_db.py: |
    import psycopg2
    import csv
    import os
    from datetime import datetime
    
    # Database connection parameters
    DB_HOST = os.getenv('DB_HOST', 'techmart-postgresql')
    DB_PORT = os.getenv('DB_PORT', '5432')
    DB_NAME = os.getenv('DB_NAME', 'techmart')
    DB_USER = os.getenv('DB_USER', 'techmart')
    DB_PASSWORD = os.getenv('DB_PASSWORD', 'techmart123')
    
    def load_orders_from_csv():
        """Load orders from CSV file"""
        orders = []
        csv_path = '/data/orders.csv'
        
        with open(csv_path, 'r') as f:
            reader = csv.DictReader(f)
            for row in reader:
                orders.append(row)
        
        return orders
    
    def insert_orders(orders):
        """Insert orders into PostgreSQL database"""
        conn = psycopg2.connect(
            host=DB_HOST,
            port=DB_PORT,
            database=DB_NAME,
            user=DB_USER,
            password=DB_PASSWORD
        )
        
        cursor = conn.cursor()
        
        # Insert orders
        insert_query = """
            INSERT INTO orders (
                order_id, customer_email, product_name, category,
                order_date, delivery_date, price, status, is_opened
            ) VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s)
            ON CONFLICT (order_id) DO UPDATE SET
                customer_email = EXCLUDED.customer_email,
                product_name = EXCLUDED.product_name,
                category = EXCLUDED.category,
                order_date = EXCLUDED.order_date,
                delivery_date = EXCLUDED.delivery_date,
                price = EXCLUDED.price,
                status = EXCLUDED.status,
                is_opened = EXCLUDED.is_opened
        """
        
        for order in orders:
            cursor.execute(insert_query, (
                order['order_id'],
                order['customer_email'],
                order['product_name'],
                order['category'],
                order['order_date'],
                order['delivery_date'],
                float(order['price']),
                order['status'],
                order['is_opened']
            ))
        
        conn.commit()
        print(f"✅ Inserted {len(orders)} orders")
        
        cursor.close()
        conn.close()
    
    if __name__ == "__main__":
        print("📊 Loading orders from CSV...")
        orders = load_orders_from_csv()
        print(f"   Found {len(orders)} orders")
        
        print("💾 Inserting orders into database...")
        insert_orders(orders)
        
        print("✅ Database initialization complete!")
---
