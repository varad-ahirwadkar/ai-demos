name: Renovate

on:
  schedule:
    # Run every 15 minutes (adjust as needed)
    - cron: '*/15 * * * *'
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Use a specific version/digest of the checkout action
        uses: actions/checkout@v4
      
      - name: Self-hosted Renovate
        # Use the official Renovate GitHub Action
        uses: renovatebot/github-action@v46.0.1 
        with:
          # Pass the GitHub token secret to the action
          token: ${{ secrets.RENOVATE_TOKEN }}
          # Specify the configuration file path
          configurationFile: .github/renovate.json
        env:
          # Optional: Use environment variables to pass global configuration
          LOG_LEVEL: 'info'
