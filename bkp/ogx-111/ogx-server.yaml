apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ogxserver
spec:
  distribution:
    name: rh
  network:
    port: 8321
  workload:
    overrides:
      env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: VLLM_URL
          value: http://qwen3-4b-predictor.ogx-sandbox.svc.cluster.local:8080/v1
        - name: VLLM_TLS_VERIFY
          value: "false"
        - name: VLLM_API_TOKEN
          value: "fake"
        - name: VLLM_MAX_TOKENS
          value: "1048"
        - name: VLLM_EMBEDDING_URL
          value: http://granite-embeddings-predictor.ogx-sandbox.svc.cluster.local:8080/v1
        - name: EMBEDDING_DIMENSION
          value: "768"
        - name: QDRANT_URL
          value: "http://qdrant-service.ogx-sandbox.svc.cluster.local:6333"
        - name: QDRANT_API_KEY
          value: "abc12345"
        - name: ENABLE_QDRANT
          value: "qdrant-remote"
