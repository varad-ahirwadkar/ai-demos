---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techmart-mcp-server
  labels:
    app: techmart-mcp-server
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: techmart-mcp-server
  template:
    metadata:
      labels:
        app: techmart-mcp-server
        component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: quay.io/vahirwad/mcp:techmart
          imagePullPolicy: Always
          ports:
            - containerPort: 9001
              protocol: TCP
              name: sse
          env:
            - name: PORT
              value: "9001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: techmart-mcp-server
  labels:
    app: techmart-mcp-server
    component: mcp-server
spec:
  selector:
    app: techmart-mcp-server
  ports:
    - protocol: TCP
      port: 9001
      targetPort: 9001
      name: sse
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: techmart-mcp-server
  labels:
    app: techmart-mcp-server
    component: mcp-server
spec:
  to:
    kind: Service
    name: techmart-mcp-server
  port:
    targetPort: sse
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

