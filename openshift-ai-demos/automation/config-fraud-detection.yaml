# Fraud Detection — model deployment configuration
# Covers: platform setup + Triton model serving only.
# Does NOT include TrustyAI or bias monitoring.
# For bias monitoring use: config-fraud-detection-trustyai.yaml
#
# Usage:
#   rhoai platform setup --config config-fraud-detection.yaml
#   rhoai usecase deploy fraud-detection --config config-fraud-detection.yaml

# Absolute path to the openshift-ai-demos directory inside the cloned repo.
# Example: if you cloned to /home/me/ai-demos, set this to /home/me/ai-demos/openshift-ai-demos
# Note: ~ is not expanded — use the full path.
repo_root: /Users/varad/Desktop/repos/ai-demos/openshift-ai-demos

operator:
  channel: stable-3.5

# DSC components to enable during platform setup.
components:
  - dashboard
  - workbenches
  - kserve

storage:
  class_name: ""   # empty = accept any available ReadWriteOnce class

deployment:
  namespace: test-fraud

  models:
    # - name: upi-fraud-detection
    #   model_uri: pvc://fraud-model-pvc/upi-fraud-detection
    #   inference_request: automation/rhoai/usecases/fraud_detection/inputs/upi-fraud-detection.json

    - name: demo-loan-nn-onnx-alpha
      model_uri: pvc://fraud-model-pvc/bias-monitoring/unbiased_model
      inference_request: automation/rhoai/usecases/fraud_detection/inputs/demo-loan.json

    # - name: demo-loan-nn-onnx-beta
    #   model_uri: pvc://fraud-model-pvc/bias-monitoring/biased_model
    #   inference_request: automation/rhoai/usecases/fraud_detection/inputs/demo-loan.json
