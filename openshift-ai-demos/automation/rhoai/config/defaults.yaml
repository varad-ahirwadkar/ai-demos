# rhoai-automation default configuration
# All values are overridden by the user config file or RHOAI_ environment variables.
# See config/loader.py for override priority and environment variable mapping.

log_level: INFO

cluster:
  url: ""             # set via oc login before running, or RHOAI_CLUSTER_URL
  namespace: redhat-ods-applications
  kubeconfig: ""      # defaults to ~/.kube/config when empty

# Absolute path to the root of the openshift-ai-demos repository.
# Used by platform/manifests.py and usecases/*/assets.py to resolve
# manifest file paths. Set via RHOAI_REPO_ROOT or the user config file.
repo_root: ""

operator:
  name: rhods-operator
  namespace: redhat-ods-operator
  channel: stable

dsc:
  name: default-dsc
  dsci_name: default-dsci

storage:
  class_name: ""        # empty = accept any available RWO class
  s3_secret_name: s3-credentials

fraud_detection:
  inference_service_name: fraud-detection   # metadata.name in the InferenceService manifest
  trustyai_service_name: trustyai-service   # metadata.name in trustyai/service/trustyai-service.yaml
  model_uri: pvc://fraud-model-pvc/models   # default: model pre-loaded on a PVC
  # Override model_uri to change where the model is loaded from:
  #   pvc://<claim-name>/<path>   — model pre-loaded on a PersistentVolumeClaim (default)
  #   hf://<org>/<repo>           — model downloaded directly from Hugging Face
  #   oci://<registry>/<image>    — model stored as an OCI artifact
  #   <s3-path>                   — plain S3 path; also fills shared/s3-secret.yaml values

# vLLM generative use case.
# model: which InferenceService manifest to deploy (filename without .yaml under
#         model-serving/generative-models/vllm/).
# Available models: qwen2.5-1.5b-instruct, phi-3-mini-4k-instruct, qwen3-4b-instruct-2507
vllm:
  model: qwen2.5-1.5b-instruct
  serving_runtime_name: vllm-cpu-runtime   # metadata.name in model-serving/shared/vllm-serving-runtime.yaml
  inference_service_name: qwen             # metadata.name inside the chosen model manifest

timeouts:
  operator_ready: 300   # seconds
  dsc_ready: 600
  inference_ready: 120
  trustyai_ready: 300
  download_complete: 1800
