# NOTE: This manifest is NOT used in the current demo deployment.
# OGX uses inline::faiss for vector storage and the shared postgres (ogx-demos/shared/postgres.yaml)
# for all other internal state. pgvector is kept here for reference only.
# Do not include this in the manage-demo.sh catalogue or deploy it alongside the demo.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-pvc
  labels:
    app: pgvector
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: pgvector-secret
type: Opaque
stringData:
  POSTGRES_DB: ogx
  POSTGRES_USER: ogx
  POSTGRES_PASSWORD: ogx
  DATABASE_URL: "postgresql://ogx:ogx@localhost/ogx"

---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
spec:
  selector:
    app: pgvector
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgvector
spec:
  serviceName: pgvector
  replicas: 1
  selector:
    matchLabels:
      app: pgvector

  template:
    metadata:
      labels:
        app: pgvector

    spec:
      initContainers:
        - name: wait-for-postgres
          image: quay.io/vahirwad/techmart:pgvector
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h localhost -p 5432 -U "$POSTGRES_USER"; do
                echo "Waiting for postgres to be ready..."
                sleep 2
              done
              echo "Postgres is ready."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pgvector-secret
                  key: POSTGRES_USER

      volumes:
        - name: postgres-run
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: pgvector-pvc

      containers:
        - name: postgres
          image: quay.io/vahirwad/techmart:pgvector
          imagePullPolicy: Always

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pgvector-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pgvector-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgvector-secret
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: PGHOST
              value: /var/run/postgresql

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pgvector-secret
                  key: DATABASE_URL

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

            - name: postgres-run
              mountPath: /var/run/postgresql

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 10
            periodSeconds: 5
