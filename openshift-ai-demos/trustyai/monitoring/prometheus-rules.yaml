apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rhoai-fraud-detection-alerts
  labels:
    app.kubernetes.io/part-of: rhoai-automation
spec:
  groups:
    - name: rhoai.inferenceservice
      interval: 60s
      rules:
        # Alert when an InferenceService has been unavailable for more than 5 minutes.
        - alert: InferenceServiceNotReady
          expr: |
            kube_customresource_status_condition{
              customresource_kind="InferenceService",
              condition="Ready",
              status="True"
            } == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "InferenceService {{ $labels.name }} is not Ready"
            description: >
              InferenceService {{ $labels.namespace }}/{{ $labels.name }} has not
              reached Ready status for more than 5 minutes. Check the pod logs
              and RHOAI serving runtime configuration.

    - name: rhoai.guardrails
      interval: 60s
      rules:
        # Alert when the GuardrailsOrchestrator deployment has no available replicas.
        - alert: GuardrailsOrchestratorUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              deployment=~"guardrails-orchestrator.*"
            } == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GuardrailsOrchestrator has no available replicas"
            description: >
              The GuardrailsOrchestrator deployment in {{ $labels.namespace }}
              has had 0 available replicas for more than 5 minutes.
              Check the orchestrator pod logs and TrustAI operator status.

        # Alert on sustained high request error rate through the guardrails gateway.
        - alert: GuardrailsGatewayHighErrorRate
          expr: |
            rate(http_requests_total{
              job=~"guardrails.*",
              status=~"5.."
            }[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High error rate on GuardrailsOrchestrator gateway"
            description: >
              More than 10% of requests to the GuardrailsOrchestrator gateway
              in namespace {{ $labels.namespace }} are returning 5xx errors.
              Check the orchestrator and detector service logs.
