---
# Allow the rhoai-automation field manager to patch inferenceservice-config.
# This removes the opendatahub.io/managed annotation so RHOAI does not revert
# changes needed for TrustyAI to intercept inference requests in RawDeployment mode.
# Applied as a strategic-merge patch — not a standalone resource.
#
# Usage (automation): resources.patch("ConfigMap", "inferenceservice-config",
#   {"metadata": {"annotations": {"opendatahub.io/managed": "false"}}},
#   namespace=<rhoai_namespace>)
#
# Kept as documentation. The patch is applied programmatically in platform/trustyai.py.
