apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-config
data:
  config.yaml: |
    # Instructions describe the bot's purpose, knowledge domain, and product catalog
    # The LLM uses these instructions to generate contextual responses
    instructions:
      - type: general
        content: |
          You are the TechGear Electronics Assistant. Follow these rules strictly:
          
          1. Answer ONLY what is asked - be concise and direct
          2. Use ONLY the information provided below
          3. If asked about something not in this information, say "I don't have that information"
          4. Do not volunteer extra information unless specifically asked
          
          Examples:
          - If asked "How much does X cost?" → Answer with just the price
          - If asked "Tell me about X" → Provide full details
          - If asked "What is the return policy?" → Answer only about returns, not shipping
          
          === PRODUCT CATALOG ===
          
          1. TechGear Pro 15 Laptop - $1,299
             Processor: Intel Core i7-13700H (14 cores, up to 5.0 GHz)
             Memory: 16GB DDR5 RAM
             Storage: 512GB NVMe SSD
             Display: 15.6" FHD (1920x1080) IPS, 144Hz
             Graphics: NVIDIA GeForce RTX 4060 (8GB GDDR6)
             Battery: Up to 8 hours
             Weight: 4.2 lbs
             Best for: Gaming, content creation, professional work
          
          2. TechGear Phone X1 - $899
             Display: 6.7" AMOLED, 120Hz
             Processor: Qualcomm Snapdragon 8 Gen 2
             Memory: 12GB RAM
             Storage: 256GB
             Camera: 50MP main + 12MP ultra-wide + 8MP telephoto
             Battery: 5000mAh with 65W fast charging
             Best for: Photography, gaming, power users
          
          === SHIPPING POLICY ===
          - Free shipping on all orders over $50
          - Standard shipping: 5-7 business days
          - Express shipping available for additional fee
          
          === RETURN POLICY ===
          - 30-day return window from date of delivery
          - Items must be in original condition with all packaging
          - Refund processed within 5-7 business days after receiving return
          - Return shipping: Customer pays return shipping unless item is defective
          
          === WARRANTY ===
          - TechGear Pro 15 Laptop: 3-year limited warranty
          - TechGear Phone X1: 1-year limited warranty
          - Covers manufacturing defects, does not cover accidental damage
          
          === CUSTOMER SUPPORT ===
          - Hours: Monday-Friday, 9 AM - 8 PM EST
          - Email: support@techgear.com
          - Phone: 1-800-TECHGEAR
          
          IMPORTANT: Only provide information from the sections above. Do not make up or infer information.

    # Sample conversations showing concise, direct responses
    sample_conversation: |
      user "How much does the phone cost?"
        ask general question
      bot provide response
        "The TechGear Phone X1 costs $899."
      
      user "What is the price of the laptop?"
        ask general question
      bot provide response
        "The TechGear Pro 15 laptop is $1,299."
      
      user "Tell me about the TechGear Pro 15"
        ask general question
      bot provide response
        "The TechGear Pro 15 is our premium laptop at $1,299. It features an Intel Core i7-13700H processor, 16GB DDR5 RAM, 512GB SSD, and NVIDIA RTX 4060 graphics. Perfect for gaming and content creation with its 144Hz display."
      
      user "What products do you have?"
        ask general question
      bot provide response
        "We offer two products: TechGear Pro 15 laptop ($1,299) and TechGear Phone X1 ($899). Which one interests you?"
      
      user "What is your return policy?"
        ask general question
      bot provide response
        "We have a 30-day return window from delivery date. Items must be in original condition. Refunds are processed within 5-7 business days. Customers pay return shipping unless the item is defective."
      
      user "Do you offer free shipping?"
        ask general question
      bot provide response
        "Yes, free shipping on orders over $50. Standard shipping takes 5-7 business days."
      
      user "What is the warranty on the laptop?"
        ask general question
      bot provide response
        "The TechGear Pro 15 comes with a 3-year limited warranty covering manufacturing defects."

    models:
      - type: main
        engine: vllm_openai
        parameters:
          openai_api_base: "http://qwen-predictor.trustyai-demo.svc.cluster.local:8080/v1"
          model_name: "qwen"
          
    rails:
      config:
        sensitive_data_detection:
          input:
            entities:
              - PERSON
              - EMAIL_ADDRESS
              - PHONE_NUMBER
              - CREDIT_CARD
          output:
            entities:
              - PERSON
              - EMAIL_ADDRESS
              - PHONE_NUMBER
              - CREDIT_CARD

      input:
        flows:
          - detect sensitive data on input
          - check message length
          - check forbidden content
          - check competitor mentions
          - check out of scope requests

      output:
        flows:
          - detect sensitive data on output

  rails.co: |
    # Colang 1.x - TechGear Electronics Store Assistant
    # Defines greeting flow, general conversation flow, and guardrails

    # ============================================================================
    # GREETING FLOW (Predefined Responses)
    # ============================================================================
    
    define user express greeting
      "hello"
      "hi"
      "hey"
      "hi there"
      "hi, how are you?"

    define bot express greeting
      "Hello! Welcome to TechGear Electronics."

    define bot introduce store
      "We have two great products: the TechGear Pro 15 laptop and TechGear Phone X1. How can I help you today?"

    define flow greeting
      user express greeting
      bot express greeting
      bot introduce store
      stop

    # ============================================================================
    # GENERAL CONVERSATION FLOW (LLM-Generated Responses)
    # ============================================================================
    
    # Wildcard pattern matches any user input not caught by other flows
    define user ask general question
      "..."
    
    # Undefined 'bot provide response' triggers LLM to generate response using instructions
    define flow general conversation
      user ask general question
      bot provide response
    
    # ============================================================================
    # GUARDRAIL: COMPETITOR BLOCKING
    # ============================================================================
    
    define flow check competitor mentions
      $competitor_result = execute check_competitor_mentions
      if $competitor_result != "allowed"
        bot redirect from competitor
        stop

    define bot redirect from competitor
      "I appreciate your interest, but I can only provide information about TechGear products. However, I'd be happy to help you find a comparable TechGear product that meets your needs!"

    # ============================================================================
    # GUARDRAIL: OUT-OF-SCOPE FILTERING
    # ============================================================================
    
    define flow check out of scope requests
      $scope_result = execute check_out_of_scope
      if $scope_result != "allowed"
        bot decline out of scope
        stop

    define bot decline out of scope
      "I'm a TechGear Electronics assistant and can only help with product inquiries and tech support. Is there anything tech-related I can help you with?"

    # ============================================================================
    # GUARDRAIL: MESSAGE LENGTH
    # ============================================================================
    
    define flow check message length
      $length_result = execute check_message_length
      if $length_result == "blocked_too_long"
        bot inform message too long
        stop

    define bot inform message too long
      "Your message is quite long. Could you please break it down into smaller questions?"

    # ============================================================================
    # GUARDRAIL: CONTENT FILTERING
    # ============================================================================
    
    define flow check forbidden content
      $forbidden_result = execute check_forbidden_content
      if $forbidden_result != "allowed"
        bot inform forbidden content
        stop

    define bot inform forbidden content
      "I can't assist with that type of request. Please ask about our products or tech support."

  actions.py: |
    from typing import Optional
    from nemoguardrails.actions import action

    # Competitor brands list
    COMPETITORS = [
        "apple", "samsung", "dell", "hp", "lenovo", "asus", "acer",
        "microsoft surface", "google pixel", "oneplus", "xiaomi",
        "macbook", "iphone", "galaxy"
    ]

    # Out-of-scope topics
    OUT_OF_SCOPE_TOPICS = [
        "medical", "health", "doctor", "medicine", "diagnosis", "treatment",
        "disease", "illness", "hospital", "pharmacy", "therapy", "nurse",
        "legal", "lawyer", "lawsuit", "contract",
        "political", "politics", "government", "president", "election", "vote",
        "investment", "stock", "crypto", "financial", "banking", "credit", "loan"
    ]

    @action(is_system_action=True)
    async def check_message_length(context: Optional[dict] = None) -> str:
        """Check if user message exceeds word count limits."""
        user_message = (context or {}).get("user_message", "")
        word_count = len(user_message.split())
        MAX_WORDS = 100
        
        if word_count > MAX_WORDS:
            return "blocked_too_long"
        return "allowed"

    @action(is_system_action=True)
    async def check_forbidden_content(context: Optional[dict] = None) -> str:
        """Check if user message contains forbidden words or inappropriate content."""
        user_message = (context or {}).get("user_message", "").lower()
        
        # Define forbidden content patterns
        forbidden_words = ["damn", "hell", "shit", "violence", "murder", "attack", "harm"]
        
        for word in forbidden_words:
            if word in user_message:
                return f"blocked_{word}"
        return "allowed"

    @action(is_system_action=True)
    async def check_competitor_mentions(context: Optional[dict] = None) -> str:
        """Check if user message mentions competitor brands."""
        user_message = (context or {}).get("user_message", "").lower()
        
        for competitor in COMPETITORS:
            if competitor in user_message:
                return f"blocked_competitor_{competitor}"
        return "allowed"

    @action(is_system_action=True)
    async def check_out_of_scope(context: Optional[dict] = None) -> str:
        """Check if user request is out of scope for e-commerce assistant."""
        user_message = (context or {}).get("user_message", "").lower()
        for topic in OUT_OF_SCOPE_TOPICS:
            if topic in user_message:
                return f"blocked_out_of_scope_{topic}"
        return "allowed"
